<!doctype html>
<!--
  Презентацияға арналған слайд: тәуекел балы 0–100 қалай жиналады.
  Сандар src/lib/risk/config.ts-тен алынған. Тіл: ?lang=kk | ru | en.
  PNG: Edge/Chrome headless арқылы 1920×1080 (×2) скриншот — docs/pitch/README.md қараңыз.
-->
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Adal As — тәуекел балы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0a1120; --card: #111a2e; --line: #22304a; --ink: #e6edf7; --ink2: #c3cedd; --muted: #8fa0b8;
    --cyan: #22d3ee; --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(rgba(148,163,184,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.04) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    padding: 52px 72px 44px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 30px;
  }
  .eyebrow { font: 600 19px/1 "IBM Plex Mono", monospace; color: var(--cyan); letter-spacing: .03em; }
  h1 { margin-top: 14px; font-size: 50px; font-weight: 700; line-height: 1.08; letter-spacing: -.01em; }
  .sub { margin-top: 10px; font-size: 23px; color: var(--ink2); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 560px; gap: 40px; min-height: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
  .components { padding: 22px 30px 18px; display: flex; flex-direction: column; }
  .card h2 { font-size: 17px; font-weight: 500; color: var(--muted); display: flex; justify-content: space-between; }
  .rows { margin-top: 6px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 26px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .name { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .rule { margin-top: 4px; font-size: 16px; line-height: 1.35; color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 12px; }
  .bar i { display: block; height: 22px; background: var(--cyan); border-radius: 0 4px 4px 0; flex: none; }
  .bar b { font: 600 25px "IBM Plex Mono", monospace; color: var(--ink); min-width: 38px; }
  .bar span { font-size: 16px; color: var(--muted); white-space: nowrap; }
  .scale { padding: 22px 28px 22px; display: flex; flex-direction: column; gap: 18px; }
  .meter { display: grid; grid-template-columns: 96px 30px minmax(0, 1fr); column-gap: 14px; height: 450px; position: relative; }
  .ticks { position: relative; font: 500 15px "IBM Plex Mono", monospace; color: var(--muted); }
  .ticks span { position: absolute; right: 0; transform: translateY(50%); }
  .zones { display: flex; flex-direction: column; gap: 2px; }
  .zones i { display: block; border-radius: 4px; }
  .labels { position: relative; }
  .zone { position: absolute; left: 0; right: 0; transform: translateY(-50%); }
  .zone .top { display: flex; align-items: baseline; gap: 10px; font-size: 22px; font-weight: 600; }
  .zone .top em { font: 500 16px "IBM Plex Mono", monospace; color: var(--muted); font-style: normal; }
  .zone p { margin-top: 2px; font-size: 16px; color: var(--ink2); line-height: 1.3; }
  .marker { position: absolute; left: 56px; width: 64px; height: 0; border-top: 2px solid var(--ink); }
  .marker::after { content: ""; position: absolute; right: -2px; top: -7px; border: 6px solid transparent; border-left: 9px solid var(--ink); }
  .marker span { position: absolute; left: -56px; top: -24px; font: 600 14px "IBM Plex Mono", monospace; color: var(--ink); white-space: nowrap; }
  .overrides { border-top: 1px solid var(--line); padding-top: 14px; }
  .overrides h3 { font-size: 16px; font-weight: 500; color: var(--muted); }
  .overrides li { list-style: none; display: flex; gap: 10px; align-items: flex-start; margin-top: 9px; font-size: 17px; line-height: 1.35; color: var(--ink); }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; }
  footer { display: flex; align-items: center; padding: 18px 26px; }
  .example { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: 20px; }
  .example .label { font-size: 16px; color: var(--muted); margin-right: 6px; }
  .part { display: inline-flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; background: #0e1628; }
  .part b { font: 600 20px "IBM Plex Mono", monospace; color: var(--cyan); }
  .op { font: 600 22px "IBM Plex Mono", monospace; color: var(--muted); }
  .result { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <main>
    <section class="card components">
      <h2><span id="compTitle"></span><span id="total"></span></h2>
      <div class="rows" id="rows"></div>
    </section>

    <section class="card scale">
      <h2 id="scaleTitle"></h2>
      <div class="meter">
        <div class="ticks"><span style="bottom:100%">100</span><span style="bottom:70%">70</span><span style="bottom:40%">40</span><span style="bottom:0">0</span></div>
        <div class="zones">
          <i style="flex:30; background: var(--red)"></i>
          <i style="flex:30; background: var(--amber)"></i>
          <i style="flex:40; background: var(--green)"></i>
        </div>
        <div class="labels" id="zones"></div>
        <div class="marker" style="bottom:43%"><span id="marker"></span></div>
      </div>
      <div class="overrides">
        <h3 id="overTitle"></h3>
        <ul>
          <li><i class="dot" style="background: var(--red)"></i><span id="over1"></span></li>
          <li><i class="dot" style="background: var(--amber)"></i><span id="over2"></span></li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="card">
    <div class="example" id="example"></div>
  </footer>

<script>
  const T = {
    kk: {
      eyebrow: "Adal As · тәуекел моделі",
      title: "Асхана не жіберіп алды — қанша балл қосылады",
      subtitle: "Жүйе әр асханаға күн сайын 0–100 балл есептейді: жасыл, сары, қызыл",
      compTitle: "Балл құрамы", total: "ең көбі · барлығы 100",
      rows: [
        ["Температура бұзушылығы", "Тоңазытқыш 2–6 °C-тан тыс немесе ыстық тағам 65 °C-тан төмен · соңғы 14 күн", 25, "+5 әр жағдай"],
        ["Порция фотосы жоқ күн", "Мәзір бар, бірақ фото жүктелмеген · соңғы 10 мәзір күні", 15, "+5 әр күн"],
        ["Ата-ана бағасы төмен", "14 күндік орташа баға 3,5-тен төмен — +8, 3,0-ден төмен — +15", 15, "+8 не +15"],
        ["Жеткізуші тәуекелі", "Бұғатталған, сертификаты өткен не қызыл алертке қатысты жеткізушінің партиясы · 14 күн", 15, "+15"],
        ["Шағымдар күрт өсті", "3 күнде 3+ төмен баға (≤2★) — 14 күндік орташадан 2 есе көп", 10, "+10"],
        ["Тексеру ескірген", "Соңғы тексеру 90 күннен бұрын — +5, 180 күннен бұрын не мүлде болмаған — +10", 10, "+5 не +10"],
        ["Мерзімі өткен нұсқама", "СЭС нұсқамасы белгіленген мерзімде орындалмаған", 10, "+5 әрқайсысы"],
      ],
      scaleTitle: "Деңгей",
      zones: [["70–100", "Қызыл", "Шұғыл: СЭС бірден әрекет етеді", 85], ["40–69", "Сары", "Кенет тексеруге ұсынылады", 55], ["0–39", "Жасыл", "Қалыпты бақылау", 20]],
      marker: "мысал · 43",
      overTitle: "Балға қарамай",
      over1: "Улану кластері: 2 сағатта 3+ оқушыда ішек-қарын белгісі → бірден қызыл",
      over2: "Сол партияны алған басқа мектеп → кемінде сары",
      exampleLabel: "Мысал · мектеп асханасы",
      parts: [["5 температура бұзушылығы", "+25"], ["ата-ана бағасы 3,0", "+8"], ["мерзімі өткен 2 нұсқама", "+10"]],
      result: "43 балл → сары: кенет тексеруге ұсынылады",
    },
    ru: {
      eyebrow: "Adal As · модель риска",
      title: "Что упустила столовая — сколько баллов добавляется",
      subtitle: "Система каждый день считает для каждой столовой балл 0–100: зелёный, жёлтый, красный",
      compTitle: "Состав балла", total: "максимум · всего 100",
      rows: [
        ["Нарушение температуры", "Холодильник вне 2–6 °C или горячее блюдо ниже 65 °C · последние 14 дней", 25, "+5 за случай"],
        ["День без фото порции", "Меню есть, а фото не загружено · последние 10 дней меню", 15, "+5 за день"],
        ["Низкая оценка родителей", "Средняя оценка за 14 дней ниже 3,5 — +8, ниже 3,0 — +15", 15, "+8 или +15"],
        ["Риск поставщика", "Партия заблокированного поставщика, с просроченным сертификатом или связанная с красной тревогой · 14 дней", 15, "+15"],
        ["Всплеск жалоб", "3+ низких оценки (≤2★) за 3 дня — вдвое выше среднего за 14 дней", 10, "+10"],
        ["Давно не проверялась", "Последняя проверка более 90 дней назад — +5, более 180 дней или ни разу — +10", 10, "+5 или +10"],
        ["Просроченное предписание", "Предписание СЭС не исполнено в срок", 10, "+5 за каждое"],
      ],
      scaleTitle: "Уровень",
      zones: [["70–100", "Красный", "Срочно: СЭС реагирует сразу", 85], ["40–69", "Жёлтый", "Рекомендована внезапная проверка", 55], ["0–39", "Зелёный", "Обычный контроль", 20]],
      marker: "пример · 43",
      overTitle: "Независимо от балла",
      over1: "Кластер отравления: 3+ ученика с кишечными симптомами за 2 часа → сразу красный",
      over2: "Другая школа, получившая ту же партию → минимум жёлтый",
      exampleLabel: "Пример · школьная столовая",
      parts: [["5 нарушений температуры", "+25"], ["оценка родителей 3,0", "+8"], ["2 просроченных предписания", "+10"]],
      result: "43 балла → жёлтый: рекомендована внезапная проверка",
    },
    en: {
      eyebrow: "Adal As · risk model",
      title: "What the canteen missed — how many points it adds",
      subtitle: "Every day the system scores each canteen from 0 to 100: green, yellow, red",
      compTitle: "Score components", total: "maximum · 100 in total",
      rows: [
        ["Temperature violation", "Fridge outside 2–6 °C or hot dish below 65 °C · last 14 days", 25, "+5 per case"],
        ["Day without a portion photo", "Menu logged but no photo uploaded · last 10 menu days", 15, "+5 per day"],
        ["Low parent rating", "14-day average below 3.5 → +8, below 3.0 → +15", 15, "+8 or +15"],
        ["Supplier risk", "Batch from a blocked supplier, one with an expired certificate or linked to a red alert · 14 days", 15, "+15"],
        ["Spike in complaints", "3+ low ratings (≤2★) in 3 days — twice the 14-day average", 10, "+10"],
        ["Inspection overdue", "Last inspection over 90 days ago → +5; over 180 days or never → +10", 10, "+5 or +10"],
        ["Overdue order", "An SES order not completed on time", 10, "+5 each"],
      ],
      scaleTitle: "Level",
      zones: [["70–100", "Red", "Urgent: SES acts at once", 85], ["40–69", "Yellow", "Unannounced inspection recommended", 55], ["0–39", "Green", "Routine monitoring", 20]],
      marker: "example · 43",
      overTitle: "Regardless of the score",
      over1: "Poisoning cluster: 3+ students with stomach symptoms within 2 hours → red at once",
      over2: "Another school that received the same batch → at least yellow",
      exampleLabel: "Example · school canteen",
      parts: [["5 temperature violations", "+25"], ["parent rating 3.0", "+8"], ["2 overdue orders", "+10"]],
      result: "43 points → yellow: unannounced inspection recommended",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang");
  const t = T[lang] || T.kk;
  document.documentElement.lang = T[lang] ? lang : "kk";
  const $ = (id) => document.getElementById(id);
  for (const key of ["eyebrow", "title", "subtitle", "compTitle", "total", "scaleTitle", "marker", "overTitle", "over1", "over2"]) {
    $(key).textContent = t[key];
  }
  document.title = `Adal As — ${t.compTitle}`;

  const PX_PER_POINT = 8; // 25 балл = 200 px
  $("rows").innerHTML = t.rows
    .map(([name, rule, max, unit]) => `
      <div class="row">
        <div><p class="name">${name}</p><p class="rule">${rule}</p></div>
        <div class="bar"><i style="width:${max * PX_PER_POINT}px"></i><b>${max}</b><span>${unit}</span></div>
      </div>`)
    .join("");

  const zoneColor = ["var(--red)", "var(--amber)", "var(--green)"];
  $("zones").innerHTML = t.zones
    .map(([range, name, text, mid], i) => `
      <div class="zone" style="top:${100 - mid}%">
        <p class="top"><i class="dot" style="background:${zoneColor[i]}; margin-top:0; align-self:center"></i>${name}<em>${range}</em></p>
        <p>${text}</p>
      </div>`)
    .join("");

  $("example").innerHTML =
    `<span class="label">${t.exampleLabel}</span>` +
    t.parts.map(([text, pts]) => `<span class="part">${text} <b>${pts}</b></span>`).join('<span class="op">+</span>') +
    `<span class="op">=</span><span class="result"><i class="dot" style="background: var(--amber); margin-top:0"></i>${t.result}</span>`;
</script>
</body>
</html>
